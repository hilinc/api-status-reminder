name: Daily Status Digest
on:
  # schedule:
  #   - cron: '0 0 * * *'    # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --registry=https://registry.npmjs.org

      - name: Restore status cache
        uses: actions/cache@v4
        with:
          path: data/last-status.json
          key: status-data

      - name: Write API probe config
        if: env.API_PROBE_CONFIG != ''
        run: echo "$API_PROBE_CONFIG" > config.json
        env:
          API_PROBE_CONFIG: ${{ secrets.API_PROBE_CONFIG }}

      - run: node src/index.js digest
        env:
          UPTIME_KUMA_BASE: https://ai.ltcraft.cn
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
