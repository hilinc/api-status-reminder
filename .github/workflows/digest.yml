name: Daily Status Digest
on:
  schedule:
    - cron: '0 1 * * *'    # 默认 UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Install Playwright Chromium
        if: env.CHECK_CX_BASE != ''
        run: npx playwright install chromium --with-deps
        env:
          CHECK_CX_BASE: https://check.linux.do

      - name: Write API probe config
        if: env.API_PROBE_CONFIG != ''
        run: echo "$API_PROBE_CONFIG" > config.json
        env:
          API_PROBE_CONFIG: ${{ secrets.API_PROBE_CONFIG }}

      - run: node src/index.js digest
        env:
          UPTIME_KUMA_BASE: https://ai.ltcraft.cn
          CHECK_CX_BASE: https://check.linux.do
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update status data (digest)'
          file_pattern: 'data/*.json'
