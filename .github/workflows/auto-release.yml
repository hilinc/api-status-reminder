name: Auto Release

on:
  push:
    branches: [main]
    tags-ignore: ['**']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip bot commits to avoid infinite loop
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump from commits
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
          fi

          echo "Commits since ${LAST_TAG:-beginning}:"
          echo "$COMMITS"

          BUMP=""
          # Check for breaking changes first
          if echo "$COMMITS" | grep -qE "(^[a-z]+(\(.*\))?!:|BREAKING CHANGE)"; then
            BUMP="major"
          # Then features
          elif echo "$COMMITS" | grep -qE "^feat(\(.*\))?:"; then
            BUMP="minor"
          # Then fixes and other releasable types
          elif echo "$COMMITS" | grep -qE "^(fix|perf|refactor)(\(.*\))?:"; then
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          if [ -z "$BUMP" ]; then
            echo "No releasable commits found, skipping release."
          else
            echo "Bump level: $BUMP"
          fi

      - name: Bump version and update changelog
        if: steps.bump.outputs.bump != ''
        id: version
        run: |
          BUMP="${{ steps.bump.outputs.bump }}"
          CURRENT=$(grep -m1 '"version"' package.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION ($BUMP)"

          # Update package.json
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" package.json

          # Update package-lock.json (root-level version entries only)
          sed -i '0,/"version": "'"$CURRENT"'"/{s/"version": "'"$CURRENT"'"/"version": "'"$NEW_VERSION"'"/}' package-lock.json
          sed -i '0,/"version": "'"$CURRENT"'"/{s/"version": "'"$CURRENT"'"/"version": "'"$NEW_VERSION"'"/}' package-lock.json

          # Update plugin.json
          sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEW_VERSION\"/" .claude-plugin/plugin.json

          # Build changelog entry from commits
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
          fi

          TODAY=$(date +%Y-%m-%d)
          ENTRY="## [$NEW_VERSION] - $TODAY"

          ADDED=$(echo "$COMMITS" | grep -E "^feat(\(.*\))?:" | sed -E 's/^feat(\([^)]*\))?: //' || true)
          CHANGED=$(echo "$COMMITS" | grep -E "^(refactor|perf)(\(.*\))?:" | sed -E 's/^(refactor|perf)(\([^)]*\))?: //' || true)
          FIXED=$(echo "$COMMITS" | grep -E "^fix(\(.*\))?:" | sed -E 's/^fix(\([^)]*\))?: //' || true)

          # Build changelog block into a temp file
          TMPFILE=$(mktemp)
          echo "" >> "$TMPFILE"
          echo "$ENTRY" >> "$TMPFILE"
          if [ -n "$ADDED" ]; then
            echo "" >> "$TMPFILE"
            echo "### Added" >> "$TMPFILE"
            while IFS= read -r line; do
              echo "- $line" >> "$TMPFILE"
            done <<< "$ADDED"
          fi
          if [ -n "$CHANGED" ]; then
            echo "" >> "$TMPFILE"
            echo "### Changed" >> "$TMPFILE"
            while IFS= read -r line; do
              echo "- $line" >> "$TMPFILE"
            done <<< "$CHANGED"
          fi
          if [ -n "$FIXED" ]; then
            echo "" >> "$TMPFILE"
            echo "### Fixed" >> "$TMPFILE"
            while IFS= read -r line; do
              echo "- $line" >> "$TMPFILE"
            done <<< "$FIXED"
          fi

          # Insert after [Unreleased] line
          sed -i "/^## \[Unreleased\]/r $TMPFILE" CHANGELOG.md
          rm "$TMPFILE"

      - name: Commit, tag, and push
        if: steps.bump.outputs.bump != ''
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .claude-plugin/plugin.json CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin main --follow-tags
