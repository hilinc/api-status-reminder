name: API Status Check
on:
  schedule:
    # 每小时触发，仅北京时间 09:00-18:00（UTC 01:00-10:00）
    # 如需自定义，修改 cron 表达式。小时范围对应 UTC 时间。
    - cron: '0 1-10 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --registry=https://registry.npmjs.org

      - name: Write API probe config
        if: env.API_PROBE_CONFIG != ''
        run: echo "$API_PROBE_CONFIG" > config.json
        env:
          API_PROBE_CONFIG: ${{ secrets.API_PROBE_CONFIG }}

      - run: node src/index.js
        env:
          UPTIME_KUMA_BASE: https://ai.ltcraft.cn
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update status data'
          file_pattern: 'data/*.json'
